services:

  api:
    build:
      context: ./services/api

    container_name: chaosforge-api

    restart: unless-stopped

    ports:
      - "8000:8000"

    networks:
      - chaosforge


  metrics:
    build:
      context: ./services/metrics

    container_name: chaosforge-metrics

    restart: unless-stopped

    ports:
      - "9101:9101"

    volumes:
      - ./reports:/reports:ro

    environment:
      INCIDENT_FILE: /reports/incidents.json

    networks:
      - chaosforge


  prometheus:
    image: prom/prometheus:v3.5.0

    container_name: chaosforge-prometheus

    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      - api
      - metrics

    networks:
      - chaosforge


  grafana:
    image: grafana/grafana:12.1.1

    container_name: chaosforge-grafana

    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus

    networks:
      - chaosforge


networks:

  chaosforge:
    driver: bridge
