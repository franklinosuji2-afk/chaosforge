global:
  scrape_interval: 5s

scrape_configs:

  - job_name: chaosforge-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: chaosforge-metrics
    metrics_path: /metrics
    static_configs:
      - targets:
          - metrics:9101

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
